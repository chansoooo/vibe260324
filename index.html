<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotto Number Generator</title>
    <link href='/style.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="controls">
            <button id="theme-toggle">Light Mode</button>
        </div>
        <h1>Lotto Number Generator</h1>
        <button id="generate">Generate Numbers</button>
        <div id="current-numbers"></div>
        <h2>History</h2>
        <div id="history"></div>
        <hr>
        <div class="partnership-section">
            <h2>Partnership Inquiry (제휴 문의)</h2>
            <form action="https://formspree.io/f/xyknravn" method="POST" id="partnership-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="_replyto" required placeholder="yourname@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required placeholder="Write your inquiry here..."></textarea>
                </div>
                <button type="submit" id="submit-inquiry">Send Inquiry</button>
            </form>
        </div>
    </div>
    <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
